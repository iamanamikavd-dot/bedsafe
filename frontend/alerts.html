<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BedSafe | Alert History</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/alerts.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-bed"></i>

            <div>

                <h2>BedSafe</h2>

                <p>Pressure Ulcer Prevention</p>

            </div>

        </div>

        <nav>

            <a href="dashboard.html">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>

            <a href="patients.html">
                <i class="fa-solid fa-user-plus"></i>
                Add Patient
            </a>

            <a href="view-patients.html">
                <i class="fa-solid fa-user-group"></i>
                View Patients
            </a>

            <a href="monitoring.html">
                <i class="fa-solid fa-heart-pulse"></i>
                Live Monitoring
            </a>

            <a href="alerts.html" class="active">
                <i class="fa-solid fa-bell"></i>
                Alert History
            </a>

            <a href="settings.html">
                <i class="fa-solid fa-gear"></i>
                Settings
            </a>

        </nav>

    </aside>

    <!-- Main Content -->

    <main class="content">

        <header class="page-header">

            <div>

                <h1>Alert History</h1>

                <p>View all reposition alerts generated by BedSafe.</p>

            </div>

            <input
                type="text"
                id="searchAlert"
                placeholder="Search alerts...">

        </header>

        <section class="table-card">

            <table>

                <thead>

                    <tr>

                        <th>Patient</th>

                        <th>Pressure</th>

                        <th>Risk</th>

                        <th>Time</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="alertTable">

                    <tr>

                        <td colspan="6" style="text-align:center;">
                            No alerts available.
                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

    </main>

</div>

<script type="module" src="js/alerts.js"></script>

</body>
</html>
