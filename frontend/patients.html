<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BedSafe | Add Patient</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/patients.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-bed"></i>
            <div>
                <h2>BedSafe</h2>
                <p>Pressure Ulcer Prevention</p>
            </div>
        </div>

        <nav>

            <a href="dashboard.html">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>

            <a href="patients.html" class="active">
                <i class="fa-solid fa-user-group"></i>
                 Add Patients
            </a>
            <a href="view-patients.html">
        <i class="fa-solid fa-user-group"></i>
        View Patients
    </a>


            <a href="monitoring.html">
                <i class="fa-solid fa-heart-pulse"></i>
                Live Monitoring
            </a>

            <a href="alerts.html">
                <i class="fa-solid fa-bell"></i>
                Alert History
            </a>

            <a href="settings.html">
                <i class="fa-solid fa-gear"></i>
                Settings
            </a>

        </nav>

    </aside>

    <!-- Main Content -->
    <main class="content">

        <header class="page-header">

            <h1>Add New Patient</h1>

            <p>Register a patient for pressure ulcer monitoring.</p>

        </header>

        <section class="form-card">

            <form id="patientForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Patient Name</label>
                        <input type="text" id="patientName" placeholder="Enter patient name" required>
                    </div>

                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="age" min="1" max="120" required>
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <select id="gender" required>
                            <option value="">Select Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Weight (kg)</label>
                        <input type="number" id="weight" required>
                    </div>

                    <div class="form-group">
                        <label>Caregiver Name</label>
                        <input type="text" id="caregiver" required>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="phone" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Address</label>
                        <textarea id="address" rows="3"></textarea>
                    </div>

                    <div class="form-group full-width">
                        <label>Emergency Contact</label>
                        <input type="text" id="emergency">
                    </div>

                </div>

                <div class="buttons">

                    <button type="reset" class="reset-btn">
                        Reset
                    </button>

                    <button type="submit" class="save-btn">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Save Patient
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

<script type="module" src="js/patients.js"></script>
</body>
</html>
