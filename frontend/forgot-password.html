<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BedSafe - Forgot Password</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/forgot-password.css">

</head>


<body>

    <!-- ==========================================
         LEFT PANEL
    ========================================== -->

    <div class="left-panel">

        <div class="brand">

            <div class="bed-icon">
                <i class="fa-solid fa-bed"></i>
            </div>

            <div>
                <h1>BedSafe</h1>
                <p>Pressure Ulcer Prevention</p>
            </div>

        </div>


        <div class="left-content">

            <h2>
                Secure Your<br>
                BedSafe Account
            </h2>

            <p>
                Reset your password and continue
                managing patient care safely.
            </p>

        </div>

    </div>



    <!-- ==========================================
         RIGHT PANEL
    ========================================== -->

    <div class="right-panel">

        <div class="forgot-container">

            <!-- ICON -->

            <div class="forgot-icon">

                <i class="fa-solid fa-lock"></i>

            </div>


            <!-- HEADING -->

            <h2>Forgot Password?</h2>

            <p class="description">

                Enter the email address associated
                with your BedSafe account and we'll
                send you a link to reset your password.

            </p>


            <!-- FORM -->

            <form id="forgotPasswordForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email address"
                            required
                        >

                    </div>

                    <small
                        id="emailError"
                        class="field-error"
                    ></small>

                </div>


                <!-- MESSAGE -->

                <div
                    id="message"
                    class="message"
                ></div>


                <!-- RESET BUTTON -->

                <button
                    type="submit"
                    class="reset-btn"
                >

                    <i class="fa-solid fa-paper-plane"></i>

                    Send Reset Link

                </button>

            </form>


            <!-- BACK TO LOGIN -->

            <div class="back-login">

                <a href="login.html">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Login

                </a>

            </div>

        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="js/forgot-password.js"
    ></script>

</body>

</html>
