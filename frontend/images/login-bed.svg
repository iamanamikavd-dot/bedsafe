<svg xmlns="http://www.w3.org/2000/svg"
     width="700"
     height="450"
     viewBox="0 0 700 450">

<defs>

<linearGradient id="bed"
x1="0"
y1="0"
x2="1"
y2="1">

<stop offset="0%"
stop-color="#3E7C6B"/>

<stop offset="100%"
stop-color="#163832"/>

</linearGradient>

<filter id="shadow">
<feDropShadow
dx="0"
dy="12"
stdDeviation="10"
flood-opacity=".15"/>
</filter>

</defs>

<!-- Background -->

<rect
width="700"
height="450"
fill="#F5F6F1"/>

<!-- Circle -->

<circle
cx="520"
cy="180"
r="120"
fill="#E8F4EF"/>

<!-- Bed -->

<g filter="url(#shadow)">

<rect
x="120"
y="170"
width="380"
height="110"
rx="20"
fill="url(#bed)"/>

<rect
x="120"
y="150"
width="140"
height="60"
rx="15"
fill="#DCE8E2"/>

<rect
x="150"
y="280"
width="20"
height="70"
fill="#163832"/>

<rect
x="450"
y="280"
width="20"
height="70"
fill="#163832"/>

</g>

<!-- Patient -->

<circle
cx="205"
cy="180"
r="22"
fill="#FFFFFF"/>

<rect
x="220"
y="170"
width="180"
height="42"
rx="20"
fill="#FFFFFF"/>

<!-- Sensor Dots -->

<circle cx="310" cy="210" r="10" fill="#E2643E">
<animate attributeName="r"
values="10;14;10"
dur="2s"
repeatCount="indefinite"/>
</circle>

<circle cx="350" cy="230" r="10" fill="#D89B3D">
<animate attributeName="r"
values="10;14;10"
dur="2.5s"
repeatCount="indefinite"/>
</circle>

<circle cx="390" cy="200" r="10" fill="#3E7C6B">
<animate attributeName="r"
values="10;14;10"
dur="3s"
repeatCount="indefinite"/>
</circle>

<!-- WiFi -->

<g stroke="#3E7C6B"
stroke-width="6"
fill="none">

<path d="M540 120
A45 45 0 0 1 600 120"/>

<path d="M550 140
A28 28 0 0 1 590 140"/>

<path d="M560 160
A14 14 0 0 1 580 160"/>

</g>

<circle
cx="570"
cy="175"
r="6"
fill="#3E7C6B"/>

<!-- Title -->

<text
x="120"
y="80"
font-size="42"
font-family="Fraunces"
fill="#163832">

BedSafe

</text>

<text
x="120"
y="115"
font-size="20"
font-family="IBM Plex Sans"
fill="#3E7C6B">

Smart Pressure Monitoring

</text>

</svg>